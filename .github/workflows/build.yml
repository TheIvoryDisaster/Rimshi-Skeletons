# Builds Rimshi Skeletons on every push and stamps it with a version (same scheme as Tithe).
#
#   main:           the major version goes up by one on every push or merge. It is kept as a git tag (v1, v2, ...):
#                   the workflow reads the highest v* tag, adds 1, builds, then tags the commit and publishes a release.
#   other branches: "<major>-<branch>.<yyyyMMdd>.<HHmm>" (UTC build time), where <major> is the last main version
#                   the branch contains. Creating a branch pushes it, so a new branch gets a build straight away.
#
# The version is compiled into RimshiSkeletons.dll (logged at startup as "[Rimshi][T] build | <version> | ...") and
# written into About.xml's <modVersion> in the packaged mod, which RimWorld shows in its mod list. The build commits
# nothing back.
#
# Beta flow (2026-10-25, as Tithe): feature branches merge into beta, and Matthew merges beta into main. On main the
# "Fold docs" job folds changelog fragments (docs/project/changelog/) into the changelog table and commits that to
# main, so pull requests open at the same time never conflict over the table. It then brings beta up to date with
# main. A push made with the workflow's own token starts no new run, so neither push uses up a version.
#
# Azure debug upload (main and beta): steps in the build job copy the packaged zip of each build to the
# repository's private container in the gutenhub storage account (managed in Matthew's azure-infra repo, where blobs
# expire after three days). It signs in with GitHub OIDC as the rimshi-skeletons-debug-upload managed identity, whose
# federated credentials must trust refs/heads/main and refs/heads/beta (immutable-ID subjects, see azure-infra). Builds
# are no longer kept as GitHub artifacts (that filled the account's Actions storage); main still attaches its zip to
# the GitHub release, and feature branches only compile and test. The blob path is <run id>/<run attempt>/<zip name>,
# so a rerun
# never overwrites an earlier upload. It reads five repository variables (Settings > Secrets and variables > Actions >
# Variables): AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID, AZURE_STORAGE_ACCOUNT, AZURE_DEBUG_CONTAINER.
# They are skipped until AZURE_CLIENT_ID is set, and marked continue-on-error so an Azure problem shows as a failed
# step (with the OIDC subject printed for comparison) but never stops the main tag and release.

name: Build

on:
  push:
    branches: ['**']
  workflow_dispatch:

# Main builds run one at a time so two merges can never claim the same version.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # contents: write for the main tag and release; id-token: write for the Azure upload's OIDC sign-in. Branch builds
    # can mint a token too, but Azure's federated credentials only trust main and beta, so it gets them nothing.
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out the version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            last=$(git tag --list 'v[0-9]*' | sed 's/^v//' | grep -E '^[0-9]+$' | sort -n | tail -1 || true)
            version=$(( ${last:-0} + 1 ))
            echo "tag=v$version" >> "$GITHUB_OUTPUT"
          else
            last=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null | sed 's/^v//' || true)
            slug=$(echo "$GITHUB_REF_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+|-+$//g')
            version="${last:-0}-${slug}.$(date -u +%Y%m%d.%H%M)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

      - name: Check changelog fragments
        run: python3 tools/changelog_fold.py --check

      # .NET 10 builds both game versions: 1.6 (net472) and 1.7 (net10.0, Waylith).
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build (1.6 and 1.7)
        run: >
          dotnet build Source/RimshiSkeletons/RimshiSkeletons.csproj -c Release -nologo
          -p:RimshiCI=true
          -p:RimshiVersion=${{ steps.version.outputs.version }}
          -p:RimshiBuildNumberOverride=${{ github.run_number }}

      - name: Check the XML parses
        shell: bash
        run: |
          set -euo pipefail
          # Only the folders that exist yet (find fails on a missing path).
          paths=()
          for p in About Defs Patches Languages Mods LoadFolders.xml; do
            if [ -e "$p" ]; then paths+=("$p"); fi
          done
          find "${paths[@]}" -name '*.xml' > xml-files.txt
          python3 -c 'import sys, xml.etree.ElementTree as ET; fs = open(sys.argv[1]).read().splitlines(); [ET.parse(f) for f in fs]; print(len(fs), "XML files parse")' xml-files.txt

      - name: Unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Package the mod
        shell: bash
        run: |
          set -euo pipefail
          out=package/RimshiSkeletons
          mkdir -p "$out"
          for d in About Defs Patches Languages Textures Sounds LoadFolders.xml 1.6 1.7; do
            [ -e "$d" ] && cp -r "$d" "$out"/
          done
          # CI builds both DLLs (2026-11-18). Both must be in the zip, so a release never silently drops a version.
          for v in 1.6 1.7; do
            [ -e "$out/$v/Assemblies/RimshiSkeletons.dll" ] || { echo "::error::No $v DLL was built"; exit 1; }
          done
          # Kept as a safety net: never claim 1.7 support without a 1.7 DLL.
          if [ ! -e "$out/1.7/Assemblies/RimshiSkeletons.dll" ]; then
            sed -i '/<li>1\.7<\/li>/d' "$out/About/About.xml"
            sed -i '/<v1\.7>/,/<\/v1\.7>/d' "$out/LoadFolders.xml"
          fi
          # After the mod's own packageId (the first one; the rest belong to dependencies).
          sed -i "0,/<\/packageId>/s||</packageId>\n  <modVersion>${{ steps.version.outputs.version }}</modVersion>|" "$out/About/About.xml"
          [ "$(grep -c '<modVersion>' "$out/About/About.xml")" = 1 ]
          (cd package && zip -qr "../RimshiSkeletons-${{ steps.version.outputs.version }}.zip" RimshiSkeletons)

      # Azure debug upload (main and beta, skipped until the AZURE_* repository variables are set). This replaces the
      # old GitHub artifact upload, which filled the account's Actions storage quota.
      - name: Show the OIDC subject
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/beta') && vars.AZURE_CLIENT_ID != ''
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          # Prints only the subject claim Azure checks (never the token), to compare with azure-infra's credential.
          token=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" | jq -r .value)
          echo "$token" | python3 -c 'import sys, json, base64; p = sys.stdin.read().split(".")[1]; print("OIDC subject:", json.loads(base64.urlsafe_b64decode(p + "=" * (-len(p) % 4)))["sub"])'

      - uses: azure/login@v2
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/beta') && vars.AZURE_CLIENT_ID != ''
        continue-on-error: true
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Upload the build to Azure Blob Storage
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/beta') && vars.AZURE_CLIENT_ID != ''
        continue-on-error: true
        shell: bash
        env:
          STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT }}
          DEBUG_CONTAINER: ${{ vars.AZURE_DEBUG_CONTAINER }}
          ZIP: RimshiSkeletons-${{ steps.version.outputs.version }}.zip
        run: |
          set -euo pipefail
          blob="${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/${ZIP}"
          az storage blob upload --auth-mode login --only-show-errors \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$DEBUG_CONTAINER" \
            --name "$blob" \
            --file "$ZIP" \
            --content-type application/zip
          echo "Uploaded $ZIP to $STORAGE_ACCOUNT/$DEBUG_CONTAINER/$blob"

      - name: Tag and release (main only)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "$TAG"
          gh release create "$TAG" "RimshiSkeletons-${TAG#v}.zip" --title "Rimshi Skeletons $TAG" --notes "Build ${{ github.run_number }} of $GITHUB_SHA."

  docs:
    name: Fold docs
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # Always works on the newest main (not the commit that started the run), so a run that starts after another
      # merge never folds the same fragment twice. Retries if main moves while it works.
      - name: Fold changelog fragments
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python3 tools/changelog_fold.py
            git add -A docs/project
            if git diff --cached --quiet; then
              echo "Nothing to fold."
              exit 0
            fi
            git commit -m "Fold changelog fragments"
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          exit 1

      # Beta gets main's fold commit (and anything merged straight into main, like checklist updates) so the next
      # beta into main pull request starts clean. A fast-forward when beta has nothing new, otherwise a merge. If the
      # merge conflicts, beta is left alone and the run says so.
      - name: Bring beta up to date with main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          if ! git fetch origin beta; then
            echo "No beta branch yet."
            exit 0
          fi
          git checkout -B beta origin/beta
          if git merge-base --is-ancestor origin/main beta; then
            echo "Beta already has main."
            exit 0
          fi
          if git merge --no-edit origin/main -m "Merge main into beta"; then
            git push origin beta
          else
            git merge --abort
            echo "::warning::Merging main into beta conflicts; merge it by hand."
          fi
