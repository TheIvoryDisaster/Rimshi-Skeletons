# Builds Rimshi Skeletons on every push and stamps it with a version (same scheme as Tithe).
#
#   main:           the major version goes up by one on every push or merge. It is kept as a git tag (v1, v2, ...):
#                   the workflow reads the highest v* tag, adds 1, builds, then tags the commit and publishes a release.
#   other branches: "<major>-<branch>.<yyyyMMdd>.<HHmm>" (UTC build time), where <major> is the last main version
#                   the branch contains. Creating a branch pushes it, so a new branch gets a build straight away.
#
# The version is compiled into RimshiSkeletons.dll (logged at startup as "[Rimshi][T] build | <version> | ...") and
# written into About.xml's <modVersion> in the packaged mod, which RimWorld shows in its mod list. Nothing is
# committed back.

name: Build

on:
  push:
    branches: ['**']
  workflow_dispatch:

# Main builds run one at a time so two merges can never claim the same version.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out the version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            last=$(git tag --list 'v[0-9]*' | sed 's/^v//' | grep -E '^[0-9]+$' | sort -n | tail -1 || true)
            version=$(( ${last:-0} + 1 ))
            echo "tag=v$version" >> "$GITHUB_OUTPUT"
          else
            last=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null | sed 's/^v//' || true)
            slug=$(echo "$GITHUB_REF_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+|-+$//g')
            version="${last:-0}-${slug}.$(date -u +%Y%m%d.%H%M)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: >
          dotnet build Source/RimshiSkeletons/RimshiSkeletons.csproj -c Release -nologo
          -p:RimshiCI=true
          -p:RimshiVersion=${{ steps.version.outputs.version }}
          -p:RimshiBuildNumberOverride=${{ github.run_number }}

      - name: Check the XML parses
        shell: bash
        run: |
          set -euo pipefail
          # Only the folders that exist yet (find fails on a missing path).
          paths=()
          for p in About Defs Patches Languages Mods LoadFolders.xml; do
            if [ -e "$p" ]; then paths+=("$p"); fi
          done
          find "${paths[@]}" -name '*.xml' > xml-files.txt
          python3 -c 'import sys, xml.etree.ElementTree as ET; fs = open(sys.argv[1]).read().splitlines(); [ET.parse(f) for f in fs]; print(len(fs), "XML files parse")' xml-files.txt

      - name: Unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Package the mod
        shell: bash
        run: |
          set -euo pipefail
          out=package/RimshiSkeletons
          mkdir -p "$out"
          for d in About Defs Patches Languages Textures Sounds LoadFolders.xml 1.6; do
            [ -e "$d" ] && cp -r "$d" "$out"/
          done
          # After the mod's own packageId (the first one; the rest belong to dependencies).
          sed -i "0,/<\/packageId>/s||</packageId>\n  <modVersion>${{ steps.version.outputs.version }}</modVersion>|" "$out/About/About.xml"
          [ "$(grep -c '<modVersion>' "$out/About/About.xml")" = 1 ]
          (cd package && zip -qr "../RimshiSkeletons-${{ steps.version.outputs.version }}.zip" RimshiSkeletons)

      - uses: actions/upload-artifact@v4
        with:
          name: RimshiSkeletons-${{ steps.version.outputs.version }}
          path: package/

      - name: Tag and release (main only)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "$TAG"
          gh release create "$TAG" "RimshiSkeletons-${TAG#v}.zip" --title "Rimshi Skeletons $TAG" --notes "Build ${{ github.run_number }} of $GITHUB_SHA."
